server:
  port: 8090

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848 # 指向Nacos容器
        # 关键修正：添加和其他服务一样的认证信息
        ephemeral: true
        heart-beat-interval: 5000
        heart-beat-timeout: 15000


    gateway:
      # 路由规则配置
      routes:
        # 用户服务路由
        - id: user-service-route
          uri: lb://user-service # lb://表示从Nacos负载均衡到user-service
          predicates:
            - Path=/api/auth/**, /api/students/**
          filters:
            - StripPrefix=1
        
        # 课程服务路由
        - id: catalog-service-route
          uri: lb://catalog-service
          predicates:
            - Path=/api/courses/**
          filters:
            - StripPrefix=1

        # 选课服务路由
        - id: enrollment-service-route
          uri: lb://enrollment-service
          predicates:
            - Path=/api/enrollments/**
          filters:
            - StripPrefix=1

      # 全局跨域配置
      globalcors:
        cors-configurations:
          '[/**]': # 匹配所有请求
            allowedOrigins: "*" # 允许所有来源
            allowedMethods: "*" # 允许所有HTTP方法
            allowedHeaders: "*" # 允许所有请求头

jwt:
  secret: ${JWT_SECRET:ThisIsMySuperLongAndExtremelySecureSecretKeyForHS512AlgorithmAtLeast64Chars}
  expiration: ${JWT_EXPIRATION:86400000}

# 暴露健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
logging:
  level:
    # 1. 将整个项目的默认日志级别设置为 DEBUG
    #    这样可以看到更多 Spring Boot 框架自身的日志
    root: INFO
    com.zjgsu.pjt.gateway: DEBUG # 将你自己的项目包路径设置为DEBUG

    # 2. 专门针对 Spring Cloud Gateway 的核心组件设置日志级别
    #    这是排查路由、过滤器、服务发现问题的关键！
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty.http.client: DEBUG # 查看底层HTTP客户端的日志

    # 3. 专门针对 Nacos 客户端的日志
    #    可以看到服务发现、注册、心跳等详细信息
    com.alibaba.cloud.nacos: DEBUG
    com.alibaba.nacos.client.naming: DEBUG