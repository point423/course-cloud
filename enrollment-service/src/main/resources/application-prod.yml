spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://enrollment-db:3306/enrollment_db?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:enrollment_user}
    password: ${DB_PASSWORD:enrollment_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# 课程服务地址（Docker环境）
catalog-service:
  url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}

user-service:
  url: ${USER_SERVICE_URL:http://user-service:8081}
logging:
  level:
    com.zjgsu.enrollmentservice: WARN
