networks:
  course-network:
    driver: bridge

services:
  # 课程目录数据库
  catalog-db:
    image: mysql:8.4
    container_name: catalog-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: catalog_db
      MYSQL_USER: catalog_user
      MYSQL_PASSWORD: catalog_pass
    ports:
      - "3307:3306"
    volumes:
      - catalog-data:/var/lib/mysql
    networks:
      - course-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v3.1.0
    container_name: nacos-standalone
    environment:
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=serverIdentity
      - NACOS_AUTH_ENABLE=true
      - JAVA_OPT=-Xms256m -Xmx256m
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlTdXBlckxvbmdBbmRBYnNvbHV0ZWx5U2VjdXJlU2VjcmV0S2V5Rm9yTmFjb3NBdXRoMTIzNDU=
    ports:
      - "9848:9848"
      - "8848:8848" # API Port
      - "8849:8080" # <-- 修正：为UI界面额外开一个门
    networks:
      - course-network
    healthcheck:
 #     test: ["CMD-SHELL", "curl -f \"http://localhost:8848/nacos/v1/console/health/liveness?accessToken=$${NACOS_AUTH_TOKEN}\""]
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # 用户数据库
  user-db:
    image: mysql:8.4
    container_name: user-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: user_db
      MYSQL_USER: user_user
      MYSQL_PASSWORD: user_pass
    ports:
      - "3306:3306"
    volumes:
      - user-data:/var/lib/mysql
    networks:
      - course-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 选课数据库
  enrollment-db:
    image: mysql:8.4
    container_name: enrollment-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: enrollment_db
      MYSQL_USER: enrollment_user
      MYSQL_PASSWORD: enrollment_pass
    ports:
      - "3308:3306"
    volumes:
      - enrollment-data:/var/lib/mysql
    networks:
      - course-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 课程目录服务
  catalog-service-1:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service-1
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://catalog-db:3306/catalog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: catalog_user
      DB_PASSWORD: catalog_pass
      SERVER_PORT: 8082 # 容器内端口固定
    ports:
      - "8090:8082"
    depends_on:
      catalog-db:
        condition: service_healthy
      nacos:
        condition: service_healthy # 依赖Nacos健康启动
    networks:
      - course-network
    restart: unless-stopped

  # 课程目录服务
  catalog-service-2:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service-2
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://catalog-db:3306/catalog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: catalog_user
      DB_PASSWORD: catalog_pass
      SERVER_PORT: 8082 # 容器内端口固定
    ports:
      - "8091:8082"
    depends_on:
      catalog-db:
        condition: service_healthy
      nacos:
        condition: service_healthy # 依赖Nacos健康启动
    networks:
      - course-network
    restart: unless-stopped

  # 课程目录服务
  catalog-service-3:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service-3
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://catalog-db:3306/catalog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: catalog_user
      DB_PASSWORD: catalog_pass
      SERVER_PORT: 8082 # 容器内端口固定
    ports:
      - "8092:8082"
    depends_on:
      catalog-db:
        condition: service_healthy
      nacos:
        condition: service_healthy # 依赖Nacos健康启动
    networks:
      - course-network
    restart: unless-stopped

  # 用户服务
  user-service-1:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service-1
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://user-db:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: user_user
      DB_PASSWORD: user_pass
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      user-db:
        condition: service_healthy
      nacos:
        condition: service_healthy # 依赖Nacos健康启动
    networks:
      - course-network
    restart: unless-stopped

  # 用户服务
  user-service-2:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service-2
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://user-db:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: user_user
      DB_PASSWORD: user_pass
      SERVER_PORT: 8084
    ports:
      - "8085:8084"
    depends_on:
      user-db:
        condition: service_healthy
      nacos:
        condition: service_healthy # 依赖Nacos健康启动
    networks:
      - course-network
    restart: unless-stopped

  # 用户服务
  user-service-3:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service-3
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://user-db:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: user_user
      DB_PASSWORD: user_pass
      SERVER_PORT: 8084
    ports:
      - "8086:8084"
    depends_on:
      user-db:
        condition: service_healthy
      nacos:
        condition: service_healthy # 依赖Nacos健康启动
    networks:
      - course-network
    restart: unless-stopped



  # 选课服务
  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
    container_name: enrollment-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://enrollment-db:3306/enrollment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: enrollment_user
      DB_PASSWORD: enrollment_pass
    ports:
      - "8083:8083"
    depends_on:
      nacos:
        condition: service_healthy # 依赖Nacos健康启动
      enrollment-db:
        condition: service_healthy
      user-service-1:
        condition: service_started
      catalog-service-1:
        condition: service_started
    networks:
      - course-network
    restart: unless-stopped

volumes:
  catalog-data:
  enrollment-data:
  user-data: